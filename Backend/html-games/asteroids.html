
<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1">
<body style="margin:0;background:black;color:white;text-align:center;font:16px Arial">
<div id="info"></div>
<canvas id="c" width="400" height="450" style="width:100%;height:75dvh;touch-action:none"></canvas>
<div id="buttons"></div>
<script>
const c=document.querySelector("canvas"),x=c.getContext("2d");
let px=200,py=225,angle=0,vx=0,vy=0,rocks=[],bullets=[],score=0,dead=false,keys={};
["Left","Thrust","Right","Fire"].forEach(k=>{
 let b=document.createElement("button");b.textContent=k;
 b.onpointerdown=e=>{e.preventDefault();keys[k]=true};
 b.onpointerup=b.onpointercancel=()=>keys[k]=false;
 buttons.appendChild(b);
});
onkeydown=e=>{keys[e.key]=true;if(dead)start()};
onkeyup=e=>keys[e.key]=false;
function start(){
 px=200;py=225;angle=vx=vy=score=0;dead=false;
 bullets=[];rocks=Array.from({length:5},()=>({
 x:Math.random()*400,y:Math.random()*450,r:20+Math.random()*20,
 vx:Math.random()*2-1,vy:Math.random()*2-1
 }));
}
start();
let tick=0;
function loop(){
 if(!dead){
 tick++;
 if(keys.Left||keys.ArrowLeft)angle-=.07;
 if(keys.Right||keys.ArrowRight)angle+=.07;
 if(keys.Thrust||keys.ArrowUp){vx+=Math.sin(angle)*.15;vy-=Math.cos(angle)*.15}
 if((keys.Fire||keys[" "])&&tick%10===0)
 bullets.push({x:px,y:py,vx:Math.sin(angle)*6,vy:-Math.cos(angle)*6});
 px=(px+vx+400)%400;py=(py+vy+450)%450;vx*=.99;vy*=.99;
 bullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy});
 bullets=bullets.filter(b=>b.x>=0&&b.x<400&&b.y>=0&&b.y<450);
 rocks.forEach(r=>{
 r.x=(r.x+r.vx+400)%400;r.y=(r.y+r.vy+450)%450;
 if(Math.hypot(px-r.x,py-r.y)<r.r+8)dead=true;
 bullets.forEach(b=>{
 if(Math.hypot(b.x-r.x,b.y-r.y)<r.r){
  r.dead=true;b.dead=true;score++;
  if(r.r>18)for(let i=0;i<2;i++)rocks.push({
   x:r.x,y:r.y,r:r.r/2,vx:Math.random()*4-2,vy:Math.random()*4-2
  });
 }
 });
 });
 rocks=rocks.filter(r=>!r.dead);
 bullets=bullets.filter(b=>!b.dead);
 if(!rocks.length)start();
 }
 x.fillStyle="black";x.fillRect(0,0,400,450);
 x.save();x.translate(px,py);x.rotate(angle);
 x.strokeStyle="white";x.beginPath();x.moveTo(0,-15);
 x.lineTo(-10,10);x.lineTo(10,10);x.closePath();x.stroke();x.restore();
 x.fillStyle="white";bullets.forEach(b=>x.fillRect(b.x,b.y,3,3));
 x.strokeStyle="white";rocks.forEach(r=>{
 x.beginPath();x.arc(r.x,r.y,r.r,0,7);x.stroke();
 });
 info.textContent="Score: "+score+(dead?" | Game Over - Press a key":"");
 requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
