
<!DOCTYPE html>
<html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<body style="margin:0;background:#111;text-align:center">
<canvas id="c" width="400" height="500" style="width:95%;max-width:400px;touch-action:none"></canvas>
<script>
const c=document.getElementById("c"),x=c.getContext("2d");
let p=170,bx=200,by=400,vx=3,vy=-3,score=0;
let bricks=Array.from({length:40},(_,i)=>i);
function move(e){
 let r=c.getBoundingClientRect();
 p=Math.max(0,Math.min(320,(e.clientX-r.left)*400/r.width-40));
}
c.onpointermove=move;c.onpointerdown=move;
function loop(){
 bx+=vx;by+=vy;
 if(bx<5||bx>395)vx*=-1;
 if(by<5)vy*=-1;
 if(by>465&&by<480&&bx>p&&bx<p+80)vy=-Math.abs(vy);
 if(by>500){bx=200;by=400;vy=-3}
 x.fillStyle="#111";x.fillRect(0,0,400,500);
 bricks=bricks.filter(i=>{
  let a=(i%8)*49+4,b=Math.floor(i/8)*25+40;
  if(bx>a&&bx<a+45&&by>b&&by<b+20){
   vy*=-1;score++;return false;
  }
  x.fillStyle=`hsl(${i*15},80%,55%)`;
  x.fillRect(a,b,45,20);return true;
 });
 if(!bricks.length)bricks=Array.from({length:40},(_,i)=>i);
 x.fillStyle="white";
 x.fillRect(p,475,80,10);
 x.beginPath();x.arc(bx,by,6,0,7);x.fill();
 x.font="20px Arial";x.fillText("Score: "+score,10,25);
 requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
