
<!DOCTYPE html>
<html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<body style="margin:0;text-align:center;background:#ddd">
<h3 id="info">Doodle Jump</h3>
<canvas id="c" width="400" height="500" style="width:95%;max-width:400px;background:white;touch-action:none"></canvas>
<p>Touch left/right side to move</p>
<script>
const c=document.getElementById("c"),x=c.getContext("2d");
let px,py,v,platforms,score,dead,dir=0,keys={};
function start(){
 px=190;py=400;v=-8;score=0;dead=false;
 platforms=Array.from({length:10},(_,i)=>({
  x:Math.random()*320,y:480-i*55
 }));
 platforms[0].x=160;
}
start();
onkeydown=e=>{keys[e.key]=true;if(dead)start()};
onkeyup=e=>keys[e.key]=false;
c.onpointerdown=c.onpointermove=e=>{
 if(!e.buttons)return;
 let r=c.getBoundingClientRect();
 dir=e.clientX-r.left<r.width/2?-1:1;
 if(dead)start();
};
c.onpointerup=()=>dir=0;
function loop(){
 if(!dead){
  let d=dir+(keys.ArrowLeft?-1:0)+(keys.ArrowRight?1:0);
  px=(px+d*4+400)%400;
  let old=py;
  v+=.3;py+=v;
  if(v>0)platforms.forEach(p=>{
   if(old+20<=p.y&&py+20>=p.y&&px+20>p.x&&px<p.x+80)v=-9;
  });
  if(py<200){
   let shift=200-py;py=200;score+=shift|0;
   platforms.forEach(p=>{
    p.y+=shift;
    if(p.y>500){p.y=0;p.x=Math.random()*320}
   });
  }
  if(py>500)dead=true;
 }
 x.fillStyle="white";x.fillRect(0,0,400,500);
 x.fillStyle="green";
 platforms.forEach(p=>x.fillRect(p.x,p.y,80,10));
 x.fillStyle="blue";x.fillRect(px,py,20,20);
 x.fillStyle="black";x.font="20px Arial";
 x.fillText("Score: "+score,10,25);
 if(dead)x.fillText("Game Over - Tap to restart",65,250);
 requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
