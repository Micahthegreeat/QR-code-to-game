
<meta name="viewport" content="width=device-width,initial-scale=1">
<body style="margin:0;background:#171921;color:white;text-align:center;font:16px Arial;touch-action:none">
<div id="info"></div>
<canvas id="c" width="360" height="440" style="width:100%;max-height:80dvh"></canvas>
<div id="menu"></div>
<script>
let x=c.getContext("2d"),map=[],en=[],p,hp,max,atk,def,floor,gold=0,best=0,bank=0,up=[0,0,0],mode=0,sx,sy;
let rand=n=>Math.random()*n|0;
try{[bank,best,up]=JSON.parse(localStorage.dungeon)}catch{}
function save(){
 try{localStorage.dungeon=JSON.stringify([bank,best,up])}catch{}
}
function button(s,f){
 let b=document.createElement("button");
 b.textContent=s;b.style="padding:10px;margin:4px;background:#345;color:white;border:0";
 b.onclick=f;menu.append(b)
}
function title(s){
 x.fillStyle="#171921";x.fillRect(0,0,360,440);
 x.fillStyle="#edb";x.font="bold 28px Arial";x.textAlign="center";x.fillText(s,180,150)
}
function home(){
 mode=0;title("POCKET DUNGEON");
 info.textContent="Best: "+best+" | Gold: "+bank;
 menu.innerHTML="";
 button("Play",start);button("Upgrades",shop)
}
function shop(){
 mode=0;title("UPGRADES");menu.innerHTML="";
 info.textContent="Gold: "+bank;
 ["Health","Attack","Defense"].forEach((s,i)=>{
 let cost=10+up[i]*10;
 button(s+" "+up[i]+" ($"+cost+")",()=>{
 if(bank>=cost){bank-=cost;up[i]++;save();shop()}
 })
 });
 button("Back",home)
}
function start(){
 floor=1;gold=0;max=hp=10+up[0]*2;
 atk=2+up[1];def=up[2];build()
}
function build(){
 mode=1;menu.innerHTML="";
 map=Array(99).fill(0);en=[];p=10;
 for(let i=0;i<99;i++)
 if(i%9==0||i%9==8||i<9||i>=90)map[i]=1;
 function place(k){
 let i;
 do{i=rand(99)}while(map[i]||i==p||en.some(a=>a[0]==i));
 map[i]=k;return i
 }
 for(let i=0;i<12;i++)place(1);
 for(let i=1;i<10;i++)map[i*9+1]=0;
 for(let i=1;i<8;i++)map[81+i]=0;
 map[88]=2;
 for(let i=0;i<5;i++)place(3);
 for(let i=0;i<2;i++)place(4);
 for(let i=0;i<3;i++)place(5);
 for(let i=0;i<Math.min(4+floor,14);i++){
 let j=place(6),k=rand(3);
 map[j]=0;en.push([j,2+floor+k*2,k])
 }
 draw()
}
function draw(){
 for(let i=0;i<99;i++){
 let a=i%9*40,b=(i/9|0)*40,k=map[i];
 x.fillStyle=k==1?"#454858":i%2?"#242733":"#2b2e39";
 x.fillRect(a,b,40,40);
 x.fillStyle=["","","#7bf","#fc4","#7e9","#c65"][k]||"white";
 x.font="25px Arial";x.textAlign="center";
 x.fillText(["","","H","$","+","^"][k]||"",a+20,b+28)
 }
 for(let a of en){
 x.fillStyle=["#d55","#e95","#a6e"][a[2]];
 x.fillRect(a[0]%9*40+7,(a[0]/9|0)*40+7,26,26);
 x.fillStyle="white";x.font="12px Arial";
 x.fillText(a[1],a[0]%9*40+20,(a[0]/9|0)*40+24)
 }
 x.fillStyle="#5df";x.beginPath();
 x.arc(p%9*40+20,(p/9|0)*40+20,13,0,7);x.fill();
 info.textContent="F"+floor+" | HP "+hp+"/"+max+" | ATK "+atk+" | DEF "+def+" | $"+gold
}
function step(d){
 if(mode!=1)return;
 let j=p+d;
 if(map[j]==1)return;
 let a=en.find(a=>a[0]==j);
 if(a){
 a[1]-=atk;
 if(a[1]<=0){en=en.filter(b=>b!=a);gold++}
 }else{
 p=j;
 let k=map[p];
 if(k==2){level();return}
 if(k==3)gold+=3;
 if(k==4)hp=Math.min(max,hp+5);
 if(k==5)hp-=2;
 map[p]=0
 }
 for(let a of en){
 let i=a[0],dx=p%9-i%9,dy=(p/9|0)-(i/9|0);
 if(Math.abs(dx)+Math.abs(dy)==1){
 hp-=Math.max(1,1+a[2]+(floor/4|0)-def);
 continue
 }
 if(a[2]==1&&rand(2))continue;
 let ds=[Math.sign(dx),9*Math.sign(dy)];
 if(rand(2))ds.reverse();
 for(let d of ds){
 let j=i+d;
 if(d&&j!=p&&map[j]!=1&&!en.some(b=>b[0]==j)){
 a[0]=j;break
 }
 }
 }
 if(hp<=0)end();else draw()
}
function level(){
 mode=2;floor++;best=Math.max(floor,best);
 title("FLOOR "+floor);menu.innerHTML="";
 info.textContent="Choose upgrade";
 let choices=["Attack +1","Defense +1","Max HP +4","Heal","Gold +10","Attack +2 / HP -2"];
 for(let i=0;i<3;i++){
 let k=rand(6);
 while(!choices[k])k=rand(6);
 button(choices[k],()=>{
 if(k==0)atk++;
 if(k==1)def++;
 if(k==2){max+=4;hp+=4}
 if(k==3)hp=max;
 if(k==4)gold+=10;
 if(k==5){atk+=2;hp=Math.max(1,hp-2)}
 build()
 });
 choices[k]=""
 }
 save()
}
function end(){
 mode=0;bank+=gold;best=Math.max(best,floor);save();
 title("GAME OVER");menu.innerHTML="";
 info.textContent="Floor "+floor+" | Gold "+gold;
 button("Retry",start);button("Menu",home)
}
c.onpointerdown=e=>{
 sx=e.clientX;sy=e.clientY;c.setPointerCapture(e.pointerId)
};
c.onpointerup=e=>{
 let a=e.clientX-sx,b=e.clientY-sy;
 if(Math.max(Math.abs(a),Math.abs(b))>10)
 step(Math.abs(a)>Math.abs(b)?Math.sign(a):9*Math.sign(b))
};
onkeydown=e=>{
 let d={ArrowUp:-9,ArrowDown:9,ArrowLeft:-1,ArrowRight:1,w:-9,s:9,a:-1,d:1}[e.key];
 if(d){e.preventDefault();step(d)}
};
home()
</script>
</body>
</html>
