x.scale(2,2);

function send(i,s,d){

 if(z[2])return 0;

  });

  }

}

function U(s,i,j,k,h){

}

 if(j>=300){
  let k=i/48|0,z=a[q];
  if(!k){
   d=(z?z[1]+1:d+1)%4;

  }
  if(k==1&&z){
   a[q]=0;

  }
  if(k==2)t=-1;
  if(k>=3){
   l=(l+(k==3?25:1))%26;
   if(z&&!z[0])z[7]=l
  }
  return
 }
 if(j>=240){
  t=(i/80|0)+3*((j-240)/20|0);
  q=-1;
  return
 }
 if(j>=220)return;
 q=(i/20|0)+12*(j/20|0);
 if(a[q]){
  d=a[q][1];
  if(!a[q][0])l=a[q][7];
  return
 }
 if(t>=0&&g>=10){
  g-=10;
  a[q]=[t,d,"","","",-1,0,l]
 }
};

function loop(){
 f++;
 if(f%12==0)step();
 B(0,0,240,320,"#222");
 a.forEach((z,i)=>{
  let j=i%12*20,k=(i/12|0)*20;
  B(j,k,19,19,i==q?"#89945a":"#39463b");
  if(z)sprite(z,j+10,k+10)
 });

 e("$"+g+" | "+p+" x"+n,120,228);

 e(z?N[z[0]]+" "+(z[2]||z[3]+"+"+z[4]):t<0?"SELECT":N[t]+" $10 "+L[l]+" "+">v<^"[d],120,238);
 N.forEach((s,i)=>U(s,i%3*80,240+(i/3|0)*20,79,t==i));

}
