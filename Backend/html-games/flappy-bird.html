
<!DOCTYPE html>
<html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<body style="margin:0;text-align:center">
<canvas id="c" width="400" height="500" style="width:100vw;height:100dvh;touch-action:none;display:block"></canvas>
<script>
const c=document.getElementById("c"),x=c.getContext("2d");
let y=250,v=0,p=400,gap=200,score=0,dead=false;
let h=Math.random()*200+80;

function flap(){
  if(dead){y=250;v=0;p=400;score=0;dead=false}
  else v=-6;
}
onkeydown=e=>{if(e.code==="Space"){e.preventDefault();flap()}};
c.onclick=flap;

function loop(){
  x.fillStyle="skyblue";
  x.fillRect(0,0,400,500);

  if(!dead){
    v+=0.35;
    y+=v;
    p-=2;
    if(p<-50){
      p=400;
      h=Math.random()*200+80;
      score++;
    }
    if(y<0||y>480||(p<90&&p+50>50&&(y<h||y+20>h+gap)))
      dead=true;
  }

  x.fillStyle="green";
  x.fillRect(p,0,50,h);
  x.fillRect(p,h+gap,50,500);

  x.fillStyle="yellow";
  x.fillRect(50,y,20,20);

  x.fillStyle="black";
  x.font="24px Arial";
  x.fillText("Score: "+score,10,30);
  if(dead)x.fillText("Game Over! Click to restart",40,250);

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
