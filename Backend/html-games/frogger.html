
<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1">
<body style="margin:0;background:#222;color:white;text-align:center;font:16px Arial">
<div id="score">Cross the road!</div>
<canvas id="c" width="400" height="500" style="width:100%;height:90dvh;touch-action:none"></canvas>
<script>
const c=document.querySelector("canvas"),x=c.getContext("2d");
let a=190,b=460,points=0,dead=false,t=0;
function move(dx,dy){
 if(dead){a=190;b=460;dead=false;return}
 a=Math.max(0,Math.min(380,a+dx*20));
 b=Math.max(0,Math.min(480,b+dy*20));
 if(b<20){points++;a=190;b=460}
}
onkeydown=e=>{
 let d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];
 if(d){e.preventDefault();move(...d)}
};
let sx,sy;
c.onpointerdown=e=>{sx=e.clientX;sy=e.clientY};
c.onpointerup=e=>{
 let dx=e.clientX-sx,dy=e.clientY-sy;
 if(Math.max(Math.abs(dx),Math.abs(dy))<15)return;
 move(Math.abs(dx)>Math.abs(dy)?Math.sign(dx):0,Math.abs(dy)>Math.abs(dx)?Math.sign(dy):0);
};
function loop(){
 t++;
 x.fillStyle="#396b39";x.fillRect(0,0,400,500);
 x.fillStyle="#333";x.fillRect(0,240,400,200);
 x.fillStyle="#168ac0";x.fillRect(0,40,400,160);
 if(!dead){
  for(let i=0;i<4;i++){
   let y=260+i*45,z=((t*(i%2?2:-2)+i*100+2000)%500+500)%500-70;
   x.fillStyle="red";x.fillRect(z,y,65,30);
   if(a<z+65&&a+20>z&&b<y+30&&b+20>y)dead=true;
  }
  let safe=false;
  for(let i=0;i<3;i++){
   let y=50+i*50,v=i%2?-1:1;
   let z=((t*v+i*100+2000)%520+520)%520-120;
   x.fillStyle="#965b30";x.fillRect(z,y,120,30);
   if(a<z+120&&a+20>z&&b<y+30&&b+20>y){
    a+=v;safe=true
   }
  }
  if(b<200&&b+20>40&&!safe)dead=true;
  if(a<0||a>380)dead=true;
 }
 x.fillStyle="lime";x.fillRect(a,b,20,20);
 score.textContent="Crossings: "+points+(dead?" | Game Over - Swipe to restart":"");
 requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
