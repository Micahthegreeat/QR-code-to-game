
<!DOCTYPE html>
<html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<body style="text-align:center;font-family:Arial;background:#ddd">
<h3 id="info">Minesweeper</h3>
<canvas id="c" width="320" height="320" style="width:95%;max-width:320px;touch-action:none"></canvas>
<p>Tap to reveal, long-press to flag</p>
<button onclick="start()">Restart</button>
<script>
const c=document.getElementById("c"),x=c.getContext("2d");
let mines,open,flags,dead,won,first;
const near=i=>Array.from({length:8},(_,k)=>{
 let dx=k%3-1,dy=(k/3|0)-1;
 return [dx,dy];
}).concat([[1,1]]).filter(([a,b])=>
 (a||b)&&i%8+a>=0&&i%8+a<8&&(i/8|0)+b>=0&&(i/8|0)+b<8
).map(([a,b])=>i+a+b*8);
function start(){
 mines=new Set();open=new Set();flags=new Set();
 dead=false;won=false;first=true;draw();
}
function reveal(i){
 if(dead||won||flags.has(i)||open.has(i))return;
 if(first){
  first=false;
  let safe=new Set([i,...near(i)]);
  while(mines.size<10){
   let n=Math.random()*64|0;
   if(!safe.has(n))mines.add(n);
  }
 }
 if(mines.has(i)){dead=true;draw();return}
 open.add(i);
 if(!near(i).filter(n=>mines.has(n)).length)
  near(i).forEach(reveal);
 if(open.size===54)won=true;
 draw();
}
function draw(){
 x.font="bold 20px Arial";x.textAlign="center";
 for(let i=0;i<64;i++){
  let a=i%8*40,b=(i/8|0)*40;
  x.fillStyle=open.has(i)?"#eee":"#aaa";
  x.fillRect(a+1,b+1,38,38);
  let n=near(i).filter(j=>mines.has(j)).length;
  x.fillStyle="black";
  let s=flags.has(i)?"🚩":dead&&mines.has(i)?"💣":open.has(i)&&n?n:"";
  x.fillText(s,a+20,b+27);
 }
 info.textContent=dead?"Game Over":won?"You Win!":"Minesweeper";
}
let down,time,held=false;
c.onpointerdown=e=>{
 e.preventDefault();
 down=e;held=false;
 time=setTimeout(()=>{
  held=true;
  let i=cell(down);
  if(i<0||open.has(i)||dead||won)return;
  flags.has(i)?flags.delete(i):flags.add(i);
  draw();
 },500);
};
function cell(e){
 let r=c.getBoundingClientRect();
 let a=(e.clientX-r.left)*320/r.width|0;
 let b=(e.clientY-r.top)*320/r.height|0;
 return a<0||a>=320||b<0||b>=320?-1:(b/40|0)*8+(a/40|0);
}
c.onpointerup=e=>{
 clearTimeout(time);
 if(!held&&cell(e)>=0)reveal(cell(e));
};
c.onpointercancel=()=>clearTimeout(time);
c.oncontextmenu=e=>e.preventDefault();
start();
</script>
</body>
</html>
