
<!DOCTYPE html>
<html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<body style="margin:0;background:black;text-align:center">
<canvas id="c" width="400" height="500" style="width:95%;max-width:400px;touch-action:none"></canvas>
<script>
const c=document.getElementById("c"),x=c.getContext("2d");
let p=210,a=210,bx=200,by=250,vx=3,vy=3,s=0,t=0;
function move(e){
 let r=c.getBoundingClientRect();
 p=Math.max(0,Math.min(420,(e.clientY-r.top)*500/r.height-40));
}
c.onpointermove=move;c.onpointerdown=move;
function loop(){
 bx+=vx;by+=vy;
 a+=(by-40-a)*.06;
 if(by<5||by>495)vy*=-1;
 if(bx<25&&bx>15&&by>p&&by<p+80)vx=Math.abs(vx);
 if(bx>375&&bx<385&&by>a&&by<a+120)vx=-Math.abs(vx);
 if(bx<0||bx>400){
  if(bx<0)t++;else s++;
  bx=200;by=250;vx=bx<0?3:-3;
 }
 x.fillStyle="black";x.fillRect(0,0,400,500);
 x.fillStyle="white";
 x.fillRect(10,p,10,80);x.fillRect(380,a,10,120);
 x.fillRect(bx-5,by-5,10,10);
 x.font="24px Arial";x.fillText(s+" : "+t,170,30);
 requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
