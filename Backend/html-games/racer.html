
<meta name="viewport" content="width=device-width,initial-scale=1">
<body style="margin:0;background:#222;color:white;text-align:center;font:16px Arial">
<div id="info"></div>
<canvas id="c" width="400" height="500" style="width:100%;height:90dvh;touch-action:none"></canvas>
<script>
let x=c.getContext("2d"),p=0,t=0,score=0,best=0,dead=1,tilt=0,base=0,sensor=0,asked=0,keys={},cars=[],items=[],env=0,curve=0,shield=0,nitro=0,streak=0,health=3,money=0,touch=0,lanes=3;
try{best=+localStorage.best||0;money=+localStorage.money||0}catch{}
function start(){
 p=t=score=shield=nitro=streak=curve=0;health=3;cars=[];items=[];dead=0;lanes=3
}
function steer(v,s){
 if(sensor!=s)base=v;
 sensor=s;tilt=v-base
}
ondeviceorientation=e=>{if(e.gamma!=null)steer(e.gamma,1)};
ondevicemotion=e=>{
 let v=e.accelerationIncludingGravity?.x;
 if(sensor!=1&&v!=null)steer(-v*6,2)
};
c.onpointerdown=e=>{
 if(!asked++){
 for(let E of [window.DeviceOrientationEvent,window.DeviceMotionEvent])
 E?.requestPermission?.().catch(()=>{})
 }
 if(dead)start();
 touch=e.clientX<innerWidth/2?-1:1;
 c.setPointerCapture(e.pointerId)
};
c.onpointerup=c.onpointercancel=()=>touch=0;
onkeydown=e=>{keys[e.key]=1;if(dead)start()};
onkeyup=e=>keys[e.key]=0;
function box(color,a,b,w,h){
 x.fillStyle=color;x.fillRect(a,b,w,h)
}
let X=(a,z)=>200+(a-p*120)*z+curve*(1-z)**2,Y=z=>150+330*z,rand=n=>Math.random()*n|0;
function road(a,b,z,w,color){
 x.fillStyle=color;x.beginPath();
 for(let [f,d] of [[z,a],[z+w,a],[z+w,b],[z,b]])x.lineTo(X(f,d),Y(d));
 x.fill()
}
function spawn(l){cars.push([l,0,rand(5),l,0])}
function loop(){
 if(!dead){
 t++;score+=nitro?3:1;
 if(nitro)nitro--;
 p+=Math.max(-30,Math.min(30,tilt))*.0015+.05*(touch+(keys.ArrowRight||0)-(keys.ArrowLeft||0));
 let edge=lanes/2-.75;
 p=Math.max(-edge,Math.min(edge,p));
 curve=Math.sin(t/240)*100;
 if(t%900==0){
 env=rand(10);
 if(!cars.length)lanes=2+rand(3)
 }
 if(t>120&&t%85==0){
 let l=rand(lanes)-(lanes-1)/2;
 spawn(l);
 if(lanes>2&&t>400&&!rand(3))spawn(l==-(lanes-1)/2?l+1:l-1)
 }
 if(t%70==0)items.push([rand(lanes)-(lanes-1)/2,0,rand(10)<7?0:1+rand(2)]);
 let speed=.007+Math.min(.009,t/400000)+(nitro?.004:0);
 for(let a of cars.concat(items))a[1]+=speed;
 cars=cars.filter(a=>{
 if(a[1]>.3&&a[1]<.55&&!rand(300))
 a[3]=Math.max(-(lanes-1)/2,Math.min((lanes-1)/2,a[3]+(rand(2)?1:-1)));
 a[0]+=(a[3]-a[0])*.025;
 let d=Math.abs(a[0]-p),w=a[2]==3?.35:.28;
 if(a[1]>=.97&&!a[4]){
 a[4]=1;
 if(d<w){
 if(shield)shield=0;
 else if(--health<=0){
 dead=1;best=Math.max(best,score/10|0);
 try{localStorage.best=best;localStorage.money=money}catch{}
 }
 return false
 }
 if(d<w+.25)score+=50
 }
 return a[1]<1.2
 });
 items=items.filter(a=>{
 if(a[1]>.95&&a[1]<1.05&&Math.abs(a[0]-p)<.3){
 if(a[2]==1)shield=1;
 else if(a[2]==2)nitro=240;
 else{money++;score+=100+streak++*10}
 return false
 }
 if(a[1]>1.2&&!a[2])streak=0;
 return a[1]<1.2
 })
 }
 let night=(t/1800|0)%2;
 box(night?"#112":"#8ce",0,0,400,150);
 box(["#396","#da6","#698","#777","#eee","#5ac","#435","#a73","#895","#333"][env],0,150,400,350);
 for(let i=0;i<24;i++)road(i/24,(i+1)/24,-lanes*60,lanes*120,night?"#333":"#444");
 for(let i=0;i<12;i++){
 let z=((i+t/10%1)/12)**2;
 for(let j=1;j<lanes;j++)road(z,z+.025,(j-lanes/2)*120,4,"white");
 for(let j of [-1,1]){
 let f=X(j*(lanes*60+80),z),h=Y(z);
 if([2,3,6,9].includes(env)){
 let k=env==2?65:140+i%3*40;
 box("#657",f-40*z,h-k*z,80*z,k*z);
 for(let a=-25;a<30;a+=25)
 for(let b=20;b<k;b+=25)
 box("#eda",f+a*z,h-b*z,12*z,15*z)
 }else{
 box(env==1?"#285":"#653",f-5*z,h-60*z,10*z,60*z);
 box(["#173","#285","","","white","#173","","#d73","#173"][env],f-20*z,h-90*z,40*z,(env==1?12:55)*z)
 }
 }
 }
 for(let a of cars.concat(items).sort((a,b)=>a[1]-b[1])){
 let z=a[1]**2,h=Y(z),f=X(a[0]*120,z),k=a[2];
 if(a.length>3){
 let w=(k==3?32:24)*z,b=(k==3?65:35)*z;
 box(["red","blue","orange","#ddd","#fa4"][k],f-w,h-b,w*2,b);
 box("#222",f-w*.8,h-b*.9,w*1.6,b*.35);
 for(let j of [f-w,f+w-8*z])box("red",j,h-8*z,8*z,5*z)
 }else{
 x.fillStyle=["yellow","cyan","lime"][k];
 x.beginPath();x.arc(f,h-15*z,12*z,0,7);x.fill()
 }
 }
 if(env==4||env==5)
 for(let i=0;i<45;i++)box("white",(i*137+t)%400,(i*73+t*4)%500,2,env==4?2:9);
 box(shield?"cyan":nitro?"lime":"#098",175,480,50,20);
 info.textContent=(score/10|0)+" Best:"+best+" HP:"+health+" $"+money+(dead?" | Tap":"")+(sensor?"":" | Touch");
 requestAnimationFrame(loop)
}
loop()
</script>
</body>
</html>
