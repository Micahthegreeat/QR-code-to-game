
<!doctype html>
<meta charset="utf-8">
<title>QG Binary Compiler</title>

<style>
body {
    font: 15px system-ui;
    background: #18202c;
    color: white;
    max-width: 1000px;
    margin: 24px auto;
    padding: 12px;
}
textarea {
    box-sizing: border-box;
    width: 100%;
    height: 220px;
    background: #10151e;
    color: white;
    font: 13px monospace;
    padding: 10px;
}
button {
    padding: 9px;
    margin: 8px 5px 8px 0;
    cursor: pointer;
}
iframe {
    width: 100%;
    height: 350px;
    background: white;
    border: 0;
}
#stats {
    white-space: pre-wrap;
    line-height: 1.7;
}
</style>

<h1>QG Binary Compiler</h1>

<textarea id="src"></textarea>

<button id="go">Compile and run</button>
<button id="load">Decode payload</button>
<button id="save">Save HTML</button>
<button id="decoder">Save decoder JS</button>

<div id="stats"></div>

<h3>Base39 payload</h3>
<textarea id="payload"></textarea>

<h3>Preview</h3>
<iframe id="preview" sandbox="allow-scripts"></iframe>

<h3>Decoded HTML</h3>
<textarea id="out" readonly></textarea>

<script>

// ============================================
// BINARY COMPILER AND DECODER
// ============================================

function codec() {

    const dict = [
        '(', ')', '{', '}', '[', ']', ';', ',',
        '=', '+', '-', '*', '/', '%', '<', '>',
        '?', ':', '.', 'let', 'const', 'fn',
        'return', 'if', 'else', 'while', 'for'
    ];

    const extra = [
        'canvas', 'blit', 'tile', 'clear', 'text',
        'frame', 'rect', 'Math', 'floor', 'null',
        'true', 'false', '==', '===', '!=', '!==',
        '<=', '>=', '&&', '||', '++', '--', '+=',
        '-=', '!', 'var', 'break', 'continue',
        'new', 'undefined', 'packedSprite', 'on',
        'setTimeout', 'requestAnimationFrame',
        'sin', 'cos', 'random', 'length',
        'document', 'window'
    ];

    const alphabet =
        '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ*+-';

    const enc = new TextEncoder();

    const dec = new TextDecoder(
        'utf-8',
        { fatal: true }
    );

    // ========================================
    // BIT WRITER
    // ========================================

    function writer() {
        let a = [], n = 0, b = 0;

        return {
            put(v, k) {
                for (let j = k - 1; j >= 0; j--) {
                    n = n * 2 + ((v >>> j) & 1);

                    if (++b === 8) {
                        a.push(n);
                        n = b = 0;
                    }
                }
            },

            end() {
                if (b)
                    a.push(n << (8 - b));

                return Uint8Array.from(a);
            }
        };
    }

    // ========================================
    // BIT READER
    // ========================================

    function reader(a) {
        let p = 0;

        return {
            get(k) {
                if (p + k > a.length * 8)
                    throw Error('Truncated binary');

                let n = 0;

                while (k--) {
                    n = n * 2 +
                        ((a[p >> 3] >>
                        (7 - (p & 7))) & 1);

                    p++;
                }

                return n;
            }
        };
    }

    // ========================================
    // VARIABLE LENGTH UNSIGNED INTEGERS
    // ========================================

    function vu(w, n) {
        if (!Number.isSafeInteger(n) || n < 0)
            throw Error('Invalid integer');

        do {
            let d = n % 128;

            n = Math.floor(n / 128);

            w.put(d + (n ? 128 : 0), 8);

        } while (n);
    }

    function ru(r) {
        let n = 0, m = 1;

        for (let i = 0; i < 8; i++) {
            let d = r.get(8);

            n += (d & 127) * m;

            if (d < 128) {
                if (!Number.isSafeInteger(n))
                    throw Error('Integer overflow');

                return n;
            }

            m *= 128;
        }

        throw Error('Integer overflow');
    }

    // ========================================
    // STRINGS
    // ========================================

    function str(w, s) {
        let a = enc.encode(s);

        vu(w, a.length);

        for (let x of a)
            w.put(x, 8);
    }

    function readstr(r) {
        let n = ru(r);

        if (n > 1000000)
            throw Error('String too large');

        return dec.decode(
            Uint8Array.from(
                { length: n },
                () => r.get(8)
            )
        );
    }

    // ========================================
    // SOURCE TO BINARY
    // ========================================

    function compile(source) {
        let w = writer();
        let names = new Map();

        // Binary format version
        w.put(1, 8);

        // Replace identifiers with numbers
        function name(s) {
            if (!names.has(s))
                names.set(s, names.size);

            vu(w, names.get(s));
        }

        let i = 0;

        while (i < source.length) {
            let s = source.slice(i);
            let m;

            // Whitespace
            if (m = /^\s+/.exec(s)) {
                i += m[0].length;
                continue;
            }

            // Comments
            if (
                m = /^\/\/[^\n]*|^\/\*[\s\S]*?\*\//
                    .exec(s)
            ) {
                i += m[0].length;
                continue;
            }

            // =================================
            // SPRITE: 3 BITS PER PIXEL
            // =================================

            if (
                m = /^sprite\s+([\w$]+)\s*\(\s*([\w$]+)\s*\)\s*\{([0-7\s]+)\}/
                    .exec(s)
            ) {
                let rows = m[3].trim().split(/\s+/);
                let a = rows[0].length;
                let b = rows.length;

                if (!a || rows.some(x => x.length !== a))
                    throw Error('Unequal sprite rows');

                w.put(30, 5);

                name(m[1]);
                name(m[2]);

                vu(w, a);
                vu(w, b);

                for (let x of rows.join(''))
                    w.put(+x, 3);

                i += m[0].length;
                continue;
            }

            // =================================
            // PALETTE: 24 BITS PER COLOR
            // =================================

            if (
                m = /^palette\s+([\w$]+)\s*=\s*\[\s*null\s*,\s*((?:['"]#[0-9a-fA-F]{6}['"]\s*,?\s*){7})\]\s*;/
                    .exec(s)
            ) {
                w.put(31, 5);

                name(m[1]);

                for (
                    let c of m[2].match(
                        /#[0-9a-fA-F]{6}/g
                    )
                ) {
                    w.put(
                        parseInt(c.slice(1), 16),
                        24
                    );
                }

                i += m[0].length;
                continue;
            }

            // String literals
            if (
                m = /^(?:"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')/
                    .exec(s)
            ) {
                w.put(29, 5);

                str(w, m[0]);

                i += m[0].length;
                continue;
            }

            // Number literals
            if (
                m = /^(?:\d+(?:\.\d+)?|\.\d+)/
                    .exec(s)
            ) {
                let n = Number(m[0]);

                if (Number.isSafeInteger(n) && n >= 0) {
                    w.put(28, 5);

                    vu(w, n);
                } else {
                    w.put(27, 5);
                    w.put(3, 2);

                    str(w, m[0]);
                }

                i += m[0].length;
                continue;
            }

            // Keywords and identifiers
            if (m = /^[A-Za-z_$][\w$]*/.exec(s)) {
                let t = m[0];

                let d = dict.indexOf(t);
                let e = extra.indexOf(t);

                if (d >= 0) {
                    w.put(d, 5);

                } else if (e >= 0) {
                    w.put(27, 5);
                    w.put(0, 2);

                    vu(w, e);

                } else if (
                    source.slice(0, i)
                        .trimEnd().endsWith('.') ||
                    /^\s*\./.test(s.slice(t.length)) &&
                    /^[A-Z]/.test(t)
                ) {
                    w.put(27, 5);
                    w.put(3, 2);

                    str(w, t);

                } else {
                    w.put(27, 5);
                    w.put(1, 2);

                    name(t);
                }

                i += t.length;
                continue;
            }

            // Operators
            if (
                m = /^(===|!==|==|!=|<=|>=|&&|\|\||\+\+|--|\+=|-=|[^\w\s])/
                    .exec(s)
            ) {
                let t = m[0];

                let d = dict.indexOf(t);
                let e = extra.indexOf(t);

                if (d >= 0) {
                    w.put(d, 5);

                } else if (e >= 0) {
                    w.put(27, 5);
                    w.put(0, 2);

                    vu(w, e);

                } else {
                    throw Error('Unsupported token ' + t);
                }

                i += t.length;
                continue;
            }

            throw Error('Unknown token at ' + i);
        }

        // End of program
        w.put(27, 5);
        w.put(2, 2);

        return w.end();
    }

    // ========================================
    // BINARY TO JAVASCRIPT
    // ========================================

    function decode(a) {
        let r = reader(a);

        if (r.get(8) !== 1)
            throw Error('Unknown version');

        let tokens = [];

        let name = () => '_v' + ru(r);

        for (let count = 0; count < 1000000; count++) {
            let t = r.get(5);

            if (t < 27) {
                tokens.push(
                    dict[t] === 'fn'
                        ? 'function'
                        : dict[t]
                );

            } else if (t === 27) {
                let k = r.get(2);

                if (k === 2)
                    return tokens.join(' ');

                if (k === 0) {
                    let v = extra[ru(r)];

                    if (v === undefined)
                        throw Error('Unknown token');

                    tokens.push(v);

                } else if (k === 1) {
                    tokens.push(name());

                } else {
                    tokens.push(readstr(r));
                }

            } else if (t === 28) {
                tokens.push(String(ru(r)));

            } else if (t === 29) {
                tokens.push(readstr(r));

            } else if (t === 30) {

                // Decode sprite
                let id = name();
                let p = name();

                let w = ru(r);
                let h = ru(r);

                if (w * h > 1000000)
                    throw Error('Sprite too big');

                let pixels = Array.from(
                    { length: w * h },
                    () => r.get(3)
                );

                tokens.push(
                    `const ${id}={
                        w:${w},
                        h:${h},
                        p:${p},
                        pixels:${JSON.stringify(pixels)}
                    };`
                );

            } else {

                // Decode palette
                let id = name();
                let p = [null];

                for (let j = 0; j < 7; j++) {
                    p.push(
                        '#' + r.get(24)
                            .toString(16)
                            .padStart(6, '0')
                    );
                }

                tokens.push(
                    `const ${id}=${JSON.stringify(p)};`
                );
            }
        }

        throw Error('Missing end marker');
    }

    // ========================================
    // BASE39 ENCODER
    // ========================================

    function base39(a) {
        let n = 0n;

        for (let v of a)
            n = n * 256n + BigInt(v);

        let s = '';

        while (n) {
            s = alphabet[Number(n % 39n)] + s;

            n /= 39n;
        }

        // Preserve leading zero bytes
        let z = 0;

        while (z < a.length && a[z] === 0)
            z++;

        return '0'.repeat(z) + s;
    }

    // ========================================
    // BASE39 DECODER
    // ========================================

    function unbase(s) {
        let n = 0n;
        let z = 0;

        while (s[z] === '0')
            z++;

        for (let c of s) {
            let x = alphabet.indexOf(c);

            if (x < 0)
                throw Error('Invalid Base39');

            n = n * 39n + BigInt(x);
        }

        let a = [];

        while (n) {
            a.push(Number(n & 255n));

            n >>= 8n;
        }

        return Uint8Array.from([
            ...Array(z).fill(0),
            ...a.reverse()
        ]);
    }

    // ========================================
    // GZIP COMPRESSION
    // ========================================

    async function zip(a, mode) {
        let stream = new Blob([a])
            .stream()
            .pipeThrough(
                mode
                    ? new DecompressionStream('gzip')
                    : new CompressionStream('gzip')
            );

        return new Uint8Array(
            await new Response(stream).arrayBuffer()
        );
    }

    // Automatically select smallest format
    async function pack(a) {
        let z = await zip(a, false);

        return Uint8Array.from(
            z.length < a.length
                ? [1, ...z]
                : [0, ...a]
        );
    }

    async function unpack(a) {
        if (a[0] === 0)
            return a.slice(1);

        if (a[0] === 1)
            return zip(a.slice(1), true);

        throw Error('Unknown compression mode');
    }

    return {
        compile,
        decode,
        base39,
        unbase,
        pack,
        unpack,
        zip
    };
}

// ============================================
// GRAPHICS RUNTIME
// NOT STORED INSIDE THE QR CODE
// ============================================

const RUNTIME = `
let canvasElement, ctx;

function canvas(w,h) {
    canvasElement = document.createElement('canvas');

    canvasElement.width = w;
    canvasElement.height = h;

    document.body.append(canvasElement);

    ctx = canvasElement.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    return canvasElement;
}

function packedSprite(w,h,bytes,p) {
    if(p.length !== 8)
        throw Error('Palette requires eight entries');

    let pixels = [];

    for(let i=0;i<w*h;i++) {
        let b=i*3;
        let v=0;

        for(let j=0;j<3;j++)
            v=v*2+(
                (bytes[(b+j)>>3]>>
                (7-((b+j)&7)))&1
            );

        pixels.push(v);
    }

    return {w,h,p,pixels};
}

function blit(s,x,y,scale=1,flags=0) {
    ctx.save();
    ctx.translate(x,y);

    let r=(flags>>2)&3;

    ctx.translate(
        s.w*scale/2,
        s.h*scale/2
    );

    ctx.rotate(r*Math.PI/2);

    ctx.scale(
        flags&1?-1:1,
        flags&2?-1:1
    );

    ctx.translate(
        -s.w*scale/2,
        -s.h*scale/2
    );

    for(let j=0;j<s.h;j++) {
        for(let i=0;i<s.w;i++) {
            let v=s.pixels[j*s.w+i];

            if(v) {
                ctx.fillStyle=s.p[v];

                ctx.fillRect(
                    i*scale,
                    j*scale,
                    scale,
                    scale
                );
            }
        }
    }

    ctx.restore();
}

function tile(s,x,y,n,m,scale=1,flags=0) {
    for(let j=0;j<m;j++) {
        for(let i=0;i<n;i++) {
            blit(
                s,
                x+i*s.w*scale,
                y+j*s.h*scale,
                scale,
                flags
            );
        }
    }
}

function clear(color='#fff') {
    ctx.fillStyle=color;

    ctx.fillRect(
        0,0,
        canvasElement.width,
        canvasElement.height
    );
}

function rect(x,y,w,h,color) {
    ctx.fillStyle=color;
    ctx.fillRect(x,y,w,h);
}

function text(s,x,y,color='#222',size=14) {
    ctx.fillStyle=color;
    ctx.font=size+'px monospace';

    ctx.fillText(s,x,y);
}

function frame(f) {
    requestAnimationFrame(f);
}
`;

// ============================================
// DEFAULT SAMPLE PROGRAM
// ============================================

const SAMPLE = `palette colors = [
    null,
    '#202638',
    '#f4be85',
    '#75452c',
    '#3984d5',
    '#244b83',
    '#ffffff',
    '#d95d58'
];

sprite stand(colors) {
    00033300
    00333330
    00322200
    00326200
    00022200
    00144410
    02144412
    00144410
    00055500
    00050500
    00050500
    00110110
}

sprite step(colors) {
    00033300
    00333330
    00322200
    00326200
    00022200
    00144410
    00144412
    02144410
    00055500
    00500500
    05000050
    11000011
}

sprite ground(colors) {
    77777777
    33333333
    33323333
    33233333
}

canvas(480,320);

fn update(t) {
    clear('#eaf4ff');

    text('SPRITE MAP',16,24);

    blit(stand,25,44,5);
    blit(stand,100,44,5,1);

    blit(step,195,44,5);
    blit(step,270,44,5,1);

    text('Original / mirrored',16,125);

    tile(ground,0,292,20,1,3);

    let phase=(t/1400)%2;

    let x=20+(phase<1?phase:2-phase)*400;

    let s=Math.floor(t/130)%2?step:stand;

    blit(s,x,244,4,phase>=1?1:0);

    frame(update);
}

frame(update);
`;

// ============================================
// USER INTERFACE
// ============================================

const q = codec();

const $ = id => document.getElementById(id);

$('src').value = SAMPLE;

// Generate playable HTML
function html(code) {

    // Validate JavaScript syntax
    new Function(RUNTIME + '\n' + code);

    return `
<!doctype html>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1">

<style>
body {
    margin:0;
    display:grid;
    place-items:center;
    min-height:100vh;
    background:#182334;
}

canvas {
    max-width:100%;
    image-rendering:pixelated;
}
</style>

<body>
<scr${'ipt'}>
${
    (RUNTIME + '\n' + code)
        .replace(/<\/script/gi, '<\\/script')
}
</scr${'ipt'}>
`;
}

// ============================================
// COMPILE, COMPRESS, DECODE AND PREVIEW
// ============================================

let revision = 0;

async function run(build) {
    let id = ++revision;

    try {
        let raw, packed, p;

        if (build) {

            // Source -> binary
            raw = q.compile($('src').value);

            // Binary -> compressed binary
            packed = await q.pack(raw);

            // Compressed binary -> Base39
            p = q.base39(packed);

        } else {

            // Load existing Base39 payload
            p = $('payload').value.trim();

            packed = q.unbase(p);
        }

        // Decode the actual payload for preview
        let decoded = await q.unpack(q.unbase(p));

        let code = q.decode(decoded);

        let h = html(code);

        if (id !== revision)
            return;

        $('payload').value = p;
        $('out').value = h;
        $('preview').srcdoc = h;

        // Compression statistics
        let gz = await q.zip(decoded, false);

        if (id !== revision)
            return;

        $('stats').textContent =
            `Binary: ${decoded.length} bytes\n` +
            `GZIP binary: ${gz.length} bytes\n` +
            `Stored payload: ${packed.length} bytes\n` +
            `Compression: ${packed[0]?'GZIP':'Raw'}\n` +
            `Base39: ${p.length} characters\n` +
            `QR capacity: ${(p.length/4296*100).toFixed(2)}%\n` +
            `URL prefix excluded`;

    } catch (e) {
        if (id === revision)
            $('stats').textContent = e.message;
    }
}

// ============================================
// EXPORT FILES
// ============================================

function save(name, s) {
    let a = document.createElement('a');

    a.href = URL.createObjectURL(
        new Blob([s])
    );

    a.download = name;
    a.click();

    setTimeout(
        () => URL.revokeObjectURL(a.href),
        1000
    );
}

$('go').onclick = () => run(true);

$('load').onclick = () => run(false);

$('save').onclick = () =>
    save('game.html', $('out').value);

$('decoder').onclick = () => {
    save(
        'decoder.js',

        codec.toString() +

        '\nconst q=codec();\n' +

        'const RUNTIME=' +
        JSON.stringify(RUNTIME) + ';\n' +

        html.toString() +

        '\nasync function decodeGame(payload){' +
        'return html(q.decode(await q.unpack(' +
        'q.unbase(payload))))}'
    );
};

// Automatically compile the sample
run(true);

</script>
