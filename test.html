let canvasElement;
let ctx;

// ============================================
// CANVAS
// ============================================

function canvas(w,h) {

    canvasElement = document.createElement('canvas');

    canvasElement.width = w;
    canvasElement.height = h;

    document.body.append(canvasElement);

    ctx = canvasElement.getContext('2d');

    ctx.imageSmoothingEnabled = false;

    return canvasElement;
}

function clear(color='#fff') {

    ctx.fillStyle = color;

    ctx.fillRect(
        0,0,
        canvasElement.width,
        canvasElement.height
    );
}

function rect(x,y,w,h,color) {

    ctx.fillStyle = color;

    ctx.fillRect(x,y,w,h);
}

function text(s,x,y,color='#222',size=14) {

    ctx.fillStyle = color;

    ctx.font = size + 'px monospace';

    ctx.fillText(s,x,y);
}

function frame(f) {

    requestAnimationFrame(f);
}

// ============================================
// POLYGONS
// ============================================

function poly(points,color) {

    if(points.length < 3) return;

    ctx.fillStyle = color;

    ctx.beginPath();

    ctx.moveTo(
        points[0][0],
        points[0][1]
    );

    for(let i=1;i<points.length;i++) {

        ctx.lineTo(
            points[i][0],
            points[i][1]
        );
    }

    ctx.closePath();
    ctx.fill();
}

// ============================================
// COLORS
// ============================================

function rgb(r,g,b) {

    return 'rgb(' +
        clamp(r,0,255) + ',' +
        clamp(g,0,255) + ',' +
        clamp(b,0,255) + ')';
}

function hsl(h,s,l) {

    return 'hsl(' +
        h + ',' +
        clamp(s,0,100) + '%,' +
        clamp(l,0,100) + '%)';
}

// ============================================
// SPRITES
// ============================================

function packedSprite(w,h,bytes,p) {

    if(p.length !== 8) {
        throw Error('Invalid palette');
    }

    let pixels = [];

    for(let i=0;i<w*h;i++) {

        let b = i*3;
        let v = 0;

        for(let j=0;j<3;j++) {

            v = v*2 + (
                (
                    bytes[(b+j)>>3] >>
                    (7-((b+j)&7))
                ) & 1
            );
        }

        pixels.push(v);
    }

    return {w,h,p,pixels};
}

function blit(s,x,y,scale=1,flags=0) {

    ctx.save();

    ctx.translate(x,y);

    let rotation = (flags>>2)&3;

    ctx.translate(
        s.w*scale/2,
        s.h*scale/2
    );

    ctx.rotate(rotation*Math.PI/2);

    ctx.scale(
        flags&1 ? -1 : 1,
        flags&2 ? -1 : 1
    );

    ctx.translate(
        -s.w*scale/2,
        -s.h*scale/2
    );

    for(let j=0;j<s.h;j++) {

        for(let i=0;i<s.w;i++) {

            let v = s.pixels[j*s.w+i];

            if(v) {

                ctx.fillStyle = s.p[v];

                ctx.fillRect(
                    i*scale,
                    j*scale,
                    scale,
                    scale
                );
            }
        }
    }

    ctx.restore();
}

function tile(s,x,y,n,m,scale=1,flags=0) {

    for(let j=0;j<m;j++) {

        for(let i=0;i<n;i++) {

            blit(
                s,
                x+i*s.w*scale,
                y+j*s.h*scale,
                scale,
                flags
            );
        }
    }
}

// ============================================
// INPUT
// ============================================

let pointerX = -Infinity;
let pointerY = -Infinity;

function touch(fn) {

    canvasElement.style.touchAction = 'none';

    canvasElement.addEventListener(
        'pointerdown',
        e => {

            const r =
                canvasElement.getBoundingClientRect();

            pointerX =
                (e.clientX-r.left) *
                canvasElement.width/r.width;

            pointerY =
                (e.clientY-r.top) *
                canvasElement.height/r.height;

            fn(pointerX,pointerY);
        }
    );
}

function hit(x,y,w,h) {

    return pointerX >= x &&
           pointerX < x+w &&
           pointerY >= y &&
           pointerY < y+h;
}

function on(event,fn) {

    window.addEventListener(event,fn);
}

// ============================================
// SEEDED RANDOMNESS
// ============================================

let randomState = Date.now() >>> 0;

function seed(n) {

    randomState = n >>> 0;
}

function random() {

    randomState = (
        Math.imul(randomState,1664525)
        + 1013904223
    ) >>> 0;

    return randomState / 4294967296;
}

function rand(min,max) {

    return Math.floor(
        random()*(max-min+1)
    ) + min;
}

// ============================================
// UTILITIES
// ============================================

function clamp(n,min,max) {

    return Math.max(
        min,
        Math.min(max,n)
    );
}

function len(a) {

    return a.length;
}

function copy(a) {

    return a.slice();
}

function remove(a,i) {

    if(
        !Number.isInteger(i) ||
        i<0 ||
        i>=a.length
    ) {
        return undefined;
    }

    return a.splice(i,1)[0];
}

function choose(a) {

    if(!a.length) {
        return undefined;
    }

    return a[rand(0,a.length-1)];
}

function shuffle(a) {

    for(let i=a.length-1;i>0;i--) {

        let j = rand(0,i);

        [a[i],a[j]] = [a[j],a[i]];
    }

    return a;
}

// ============================================
// SAVE AND LOAD
// ============================================

function save(data) {

    if(!__qgStorageAvailable) {
        return false;

        const encoded = JSON.stringify(data);

        if(
            encoded === undefined ||
            encoded.length > 65536

        window.parent.postMessage({
            type:'QG_SAVE',
            data:encoded
        },__qgParentOrigin);

        __qgSavedData = encoded;

        return true;

    } catch(e) {

        return false;
    }
}

function load() {

    try {

        return JSON.parse(__qgSavedData);

    } catch(e) {

        return null;
    }
}
